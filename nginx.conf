# Sample nginx server block for the portfolio (static Astro build).
# Copy to /etc/nginx/sites-available/, symlink into sites-enabled/, then:
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS: run `sudo certbot --nginx -d mariomendonca.dev -d www.mariomendonca.dev`
# (certbot will inject the SSL directives and the 80->443 redirect for you).

server {
    listen 80;
    listen [::]:80;
    server_name mariomendonca.dev www.mariomendonca.dev;  # TODO: your domain

    # Path on the VPS where you rsync the built `dist/` (see deploy.sh).
    root /var/www/mariomendonca-portfolio;
    index index.html;

    # gzip (add brotli here if your nginx has the module)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # Long cache for fingerprinted assets (Astro hashes filenames in /_astro/).
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(?:woff2|woff|ttf|png|jpg|jpeg|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Don't cache HTML (so deploys show up immediately).
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Astro builds /pt/ as /pt/index.html — try files, then directory index.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
